<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-label="QubitDesk">
  <!-- QubitDesk's Q and D in white on a blue tile: the right-hand side of
       the Q's ring is the stem of the D, the Q's tail fills the join beneath
       them and comes to a point, and the Q's counter holds a ticket, notched
       and perforated.
       The letters are filled rather than stroked, and the name is not set
       in type: this is seen at sixteen pixels far more often than at any
       other size, and areas survive there what lines and lettering do not.
       The tile is part of the mark rather than a background: it carries the
       colour, so this reads the same on a white tab strip, a dark one, and
       whatever colour somebody has made their taskbar.
       The installed app's icons and the Windows icon are drawn from these
       numbers by imaging.Mark, the Android app's icons carry the same paths,
       and tests fail when any of them parts from this file. -->
  <title>QubitDesk</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a69a7"/>
      <stop offset="0.5" stop-color="#095795"/>
      <stop offset="1" stop-color="#03447a"/>
    </linearGradient>
  </defs>
  <rect width="560" height="560" rx="29" fill="url(#ground)"/>
  <g fill="#ffffff">
    <path d="M73.36 268A140 140 0 0 1 302.82 160.31V128H346.64A140 140 0 0 1 486.64 268A140 140 0 0 1 346.64 408H333.06L297.64 443.42L255.67 401.45A140 140 0 0 1 73.36 268ZM111.36 268A102 102 0 0 0 213.36 370A102 102 0 0 0 315.36 268A102 102 0 0 0 213.36 166A102 102 0 0 0 111.36 268ZM346.64 166H309.26A140 140 0 0 1 309.26 370H346.64A102 102 0 0 0 448.64 268A102 102 0 0 0 346.64 166Z"/>
    <path d="M155.38 249.62L194.98 210.02A8 8 0 0 1 206.29 210.02L230.33 234.06A12 12 0 0 0 230.33 251.03A12 12 0 0 0 247.3 251.03L271.34 275.07A8 8 0 0 1 271.34 286.38L231.74 325.98A8 8 0 0 1 220.43 325.98L196.39 301.94A12 12 0 0 0 196.39 284.97A12 12 0 0 0 179.42 284.97L155.38 260.93A8 8 0 0 1 155.38 249.62ZM200.1 275.6A4 4 0 0 0 200.1 281.26A4 4 0 0 0 205.76 281.26L206.47 280.55A4 4 0 0 0 206.47 274.89A4 4 0 0 0 200.81 274.89ZM210.18 265.53A4 4 0 0 0 210.18 271.18A4 4 0 0 0 215.83 271.18L216.54 270.47A4 4 0 0 0 216.54 264.82A4 4 0 0 0 210.89 264.82ZM220.25 255.45A4 4 0 0 0 220.25 261.11A4 4 0 0 0 225.91 261.11L226.62 260.4A4 4 0 0 0 226.62 254.74A4 4 0 0 0 220.96 254.74Z"/>
