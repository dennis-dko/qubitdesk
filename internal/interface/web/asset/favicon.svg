<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-label="Go-Ticket-System">
  <!-- An hourglass on its own tile: the mark the ticket system took with it
       when it was cloned from the time recording, which has a mark of its own
       since. It stands in until the ticket system has one (K8 in
       doc/audit-open.md). The two halves meet in the middle, and the lower one
       is dimmer - the sand that has already fallen.
       Filled rather than stroked: this is seen at sixteen pixels far more often
       than at any other size, and areas survive there what lines do not.
       The tile is part of the mark rather than a background: it carries the
       colour, so this reads the same on a white tab strip, a dark one, and
       whatever colour somebody has made their taskbar. One colour, the accent
       the page is drawn in, written as the gradient every copy is held to, so
       a mark that runs from one blue to another changes numbers rather than
       code.
       The installed app's icons and the Windows icon are drawn from these
       numbers by imaging.Mark, the Android app's icons carry the same paths,
       and tests fail when any of them parts from this file. -->
  <title>Go-Ticket-System</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6feb"/>
      <stop offset="1" stop-color="#2f6feb"/>
    </linearGradient>
  </defs>
  <rect width="560" height="560" rx="163.69" fill="url(#ground)"/>
  <g fill="#ffffff">
    <path d="M142.15 120.62H417.85L280 280Z"/>
    <path d="M142.15 439.38H417.85L280 280Z" opacity="0.55"/>
  </g>
</svg>
